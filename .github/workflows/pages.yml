name: Publish Tarn website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Load catalog generated by Tarn
        run: |
          curl --fail --proto '=https' --tlsv1.2 --max-time 30 https://tarn-lng.github.io/registry/catalog.json -o catalog.json
          node --check assets/app.js
          node -e 'const fs=require("fs"),c=JSON.parse(fs.readFileSync("catalog.json"));if(c.generator!=="Tarn"||c.schema_version!==1||!Array.isArray(c.packages))process.exit(1)'
      - name: Stage public website files
        run: |
          mkdir -p build/site
          cp index.html catalog.json install.sh build/site/
          cp -R assets build/site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - uses: actions/deploy-pages@v4
        id: deployment

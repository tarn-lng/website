}</code></pre><div class="window-bottom">Own your data. Make errors visible.</div></div></section><section class="section"><div class="section-label">01 / THE LANGUAGE</div><h2>High-level by default.<br>Low-level when needed.</h2><div class="features"><article><span class="feature-number">01</span><h3>Ownership you can see</h3><p>Moves and borrows checked before execution. Inferred lifetimes keep ordinary code free of lifetime annotations.</p></article><article><span class="feature-number">02</span><h3>A regular surface</h3><p>Explicit returns, prefix <code>try</code>, nominal interfaces and a small set of consistent constructs.</p></article><article><span class="feature-number">03</span><h3>Tools that explain</h3><p>JSON diagnostics, public API discovery and a language server use facts from the real compiler frontend.</p></article></div></section><section class="section evidence"><div><div class="section-label">02 / REAL WORK</div><h2>A language earns<br>its place by running.</h2><p>HTTP services, CSV reports and a Linux metrics collector guide Tarn's development. The package registry itself is validated and its catalog generated by a Tarn program.</p><a href="#project" class="text-link">See what works today →</a></div><div class="evidence-card"><span class="tag">BUILT WITH TARN</span><h3>Registry tooling</h3><p>Source inventory checks · SHA-256 integrity · Immutable releases · Catalog generation</p><div class="terminal-line">$ ./build/registry</div><strong>PASS: Tarn registry validation</strong><p class="muted">SHA-256 uses the system's sha256sum tool. No package code is executed.</p></div></section><section class="cta"><div><div class="section-label">YOUR FIRST PROGRAM</div><h2>Start small.<br>Build something real.</h2></div><a class="button primary" href="#install">Install from source ↗</a></section></template>
